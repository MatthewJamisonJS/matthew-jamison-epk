name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      # Pages uploads everything under the output dir ("."), and only
      # node_modules/.git/.DS_Store are auto-excluded — prune source that
      # must never ship as a static asset (the Worker deploys separately
      # via wrangler deploy from worker/).
      - name: prune non-site files
        run: rm -rf worker docs
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=matthew-jamison-epk
