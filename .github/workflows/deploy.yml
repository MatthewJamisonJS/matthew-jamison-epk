name: deploy

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        description: Exact published main commit to build and deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: verify deployment revision
        env:
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$REQUESTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: install audited build tooling
        run: npm ci --prefix worker --ignore-scripts
      - name: frontend regression tests
        run: |
          node scripts/build.test.mjs
          node scripts/player.test.mjs
      - name: verify toolchain
        run: |
          npm run check:dependencies --prefix worker
          npm audit --prefix worker --audit-level=low
          node -e "if (require('./worker/node_modules/wrangler/package.json').version !== '4.161.0') throw Error('Review Pages Wrangler version before upgrading')"
      # Publish an explicit public-file allowlist, never the checkout itself.
      # Tooling stays outside the output, available for both minify and deploy.
      - name: build isolated public output
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pages-output"
          build_sha="$(git rev-parse HEAD)"
          mkdir -p "$output"
          cp index.html 404.html _headers robots.txt sitemap.xml llms.txt google84b19217eb072b7b.html style.css script.js player.js blog.js subscribe.js "$output/"
          cp -R assets games privacy terms thanks "$output/"
          rm -rf "$output/games/_test"
          node scripts/build.mjs --out "$output"
          sed -i "s/?v=dev/?v=${build_sha::8}/g" "$output/index.html" "$output/404.html"
          find "$output/music" "$output/blog" -name index.html -print0 | xargs -0 sed -i "s/?v=dev/?v=${build_sha::8}/g"
          for file in style.css script.js player.js blog.js subscribe.js; do
            node worker/node_modules/wrangler/node_modules/esbuild/bin/esbuild "$output/$file" --minify --allow-overwrite --outfile="$output/$file"
          done
          for private in worker docs scripts data content .git .github .env .dev.vars wrangler.jsonc; do
            test ! -e "$output/$private"
          done
          test ! -e "$output/games/_test"
          test -s "$output/music/index.html"
          test -s "$output/blog/index.html"
          test -s "$output/feed.xml"
      # Use only the locked, installed Wrangler. No action bootstrap or npx
      # download. Credentials exist only for this publishing step.
      - name: publish Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node worker/node_modules/wrangler/bin/wrangler.js pages deploy "$RUNNER_TEMP/pages-output" --project-name=matthew-jamison-epk --branch=main --commit-hash="$(git rev-parse HEAD)"
