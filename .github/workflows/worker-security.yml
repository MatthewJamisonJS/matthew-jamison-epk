name: worker security and regression checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-security.yml'
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-security.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Platform binaries are supplied as optional npm packages; avoid running
      # dependency lifecycle scripts. No credentials or remote services needed.
      - run: npm ci --ignore-scripts
      - run: npm run verify
      # Regression floors cover the supplied findings, including native Brotli.
      # The live audit additionally detects newly published npm advisories.
      - run: npm audit --audit-level=low
